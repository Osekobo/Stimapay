<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StimaPay USSD Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; gap: 32px; flex-wrap: wrap; color: #e8f1f5;
  }
  .phone {
    width: 300px; background: #111; border-radius: 40px; padding: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .screen {
    background: #f2f7fa; color: #15262e; border-radius: 8px; height: 440px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .statusbar {
    background: #15262e; color: #9ce0b0; font-size: 11px; letter-spacing: 1px;
    padding: 6px 12px; display: flex; justify-content: space-between;
  }
  .dial { flex: 1; padding: 12px; display: flex; flex-direction: column; }
  .dial.active { background: #dff0e8; }
  .dial h3 { font-size: 13px; margin-bottom: 8px; white-space: pre-wrap; line-height: 1.5; }
  .bundle-list { font-size: 13px; line-height: 1.7; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 4px 0; }
  .key {
    height: 52px; border-radius: 12px; border: none; font-size: 18px; font-weight: 600;
    background: #2b3a44; color: #fff; cursor: pointer;
  }
  .key:active { transform: scale(.94); background: #3f5663; }
  .key.star, .key.hash { font-size: 22px; }
  .key.go { background: #1f7a4d; grid-column: span 3; font-size: 15px; }
  .key.clear { background: #7a2b2b; font-size: 13px; }
  #input { font-size: 15px; text-align: center; padding: 8px; border: 1px solid #b7c8d1; border-radius: 8px; margin-bottom: 10px; }
  .panels { display: flex; flex-direction: column; gap: 16px; width: 380px; }
  .panel {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 16px; font-size: 13px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9ce0b0; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.08); }
  th { color: #9ce0b0; font-weight: 600; }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #1f7a4d; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .toast.error { background: #7a2b2b; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="statusbar"><span>StimaPay</span><span>USSD *384#</span></div>
    <div class="dial">
      <h3 id="prompt"></h3>
      <input id="input" placeholder="Enter option..." readonly />
      <div class="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key star" data-k="*">*</button>
        <button class="key" data-k="0">0</button>
        <button class="key hash" data-k="#">#</button>
        <button class="key clear">CLEAR</button>
        <button class="key go">SEND</button>
      </div>
    </div>
  </div>
</div>

<div class="panels">
  <div class="panel">
    <h2>Bundles</h2>
    <div id="bundles" class="bundle-list"></div>
  </div>
  <div class="panel">
    <h2>Recent Transactions</h2>
    <table><thead><tr><th>Phone</th><th>Bundle</th><th>Amount</th><th>Receipt</th></tr></thead><tbody id="transactions"></tbody></table>
  </div>
  <div class="panel">
    <h2>Recent SMS</h2>
    <div id="sms"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let session = { phone: '0712345678', text: '' };
  const $ = id => document.getElementById(id);

  async function send() {
    const button = document.querySelector('.key.go');
    button.disabled = true;
    try {
      const res = await fetch('/api/ussd-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(session)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data.response);
      refresh();
    } catch (err) {
      toast('Request failed: ' + err.message, true);
    } finally {
      button.disabled = false;
    }
  }

  function render(raw) {
    const [status, ...lines] = raw.split('\n');
    const cont = status.trim() === 'CON';
    $('prompt').textContent = lines.join('\n');
    $('prompt').textContent += cont ? '\n' : '';
    session.text = cont ? '' : session.text;
  }

  document.querySelectorAll('.key[data-k]').forEach(k =>
    k.addEventListener('click', () => {
      session.text = session.text ? session.text + '*' + k.dataset.k : k.dataset.k;
      $('input').value = session.text;
    })
  );

  document.querySelector('.key.clear').addEventListener('click', () => {
    session.text = '';
    $('input').value = '';
  });

  document.querySelector('.key.go').addEventListener('click', send);

  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });

  async function refresh() {
    try {
      const [b, t, s] = await Promise.all([
        fetch('/api/bundles').then(r => r.json()),
        fetch('/api/transactions').then(r => r.json()),
        fetch('/api/sms').then(r => r.json())
      ]);
      $('bundles').innerHTML = b.map(x => `<div>${x.id}. ${x.name} &mdash; KSh ${x.price} (${x.data_mb} MB)</div>`).join('');
      $('transactions').innerHTML = t.slice(0, 8).map(x => `<tr><td>${x.phone}</td><td>${x.bundle}</td><td>${x.amount}</td><td>${x.receipt}</td></tr>`).join('');
      $('sms').innerHTML = s.slice(0, 5).map(x => `<div>&bull; ${x.phone}: ${x.message}</div>`).join('') || '<div>No SMS yet</div>';
    } catch {}
  }

  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast' + (isError ? ' error' : '');
    el.style.display = 'block';
    setTimeout(() => (el.style.display = 'none'), 2500);
  }

  const start = () => {
    session = { phone: '0712345678', text: '' };
    $('input').value = '';
    send();
  };
  start();
</script>
</body>
</html>
